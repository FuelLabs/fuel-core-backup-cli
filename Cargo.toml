[package]
name = "fuel-core-backup-cli"
version = "0.46.0"
edition = "2024"
rust-version = "1.86.0"

[dependencies]
clap = "4.5.38"
anyhow = { version = "1.0.100", default-features = false }
fuel-core = { version = "0.46.0", features = ["backup"], default-features = false }
tar = { version = "0.4.44", optional = true, default-features = false }
tempfile = { version = "3.20.0", optional = true , default-features = false }
rayon = { version = "1.10.0", optional = true }

[features]
archive = ["dep:tar", "dep:tempfile", "dep:rayon"]
default = ["archive"]
